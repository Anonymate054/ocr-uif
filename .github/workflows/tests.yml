name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff==0.17.5
      - name: Lint (imports y variables sin uso, errores comunes)
        run: ruff check --select F,B ui scripts tests
      - name: Pruebas
        run: python -m pytest -q tests
